# QQ 机器人回复配置。
# 修改本文件后重启机器人即可生效；敏感的 QQ_BOTS 配置仍放在 .env.prod。
version: 1

settings:
  enabled: true
  # 命令支持 /帮助、!帮助、！帮助和不带前缀的帮助。
  command_prefixes: ["/", "!", "！"]
  trim_whitespace: true
  ignore_case: true
  only_when_mentioned: false
  # 同一条消息只发送第一条命中的规则，规则按 priority 从小到大执行。
  stop_after_match: true
  fallback:
    enabled: false
    text: "暂时没有找到对应功能，发送 /帮助 查看可用命令。"

rules:
  # 需要机器人具备直接发送 Markdown 的权限；启用后发送 /markdown 测试。
  - id: markdown-demo
    enabled: true
    priority: 5
    trigger:
      type: command
      values: ["markdown"]
    reply:
      type: markdown
      text: |
        # 协会小助手
        **欢迎使用！**
        发送 /帮助 查看可用功能。

  # 模板方式：替换为已审核通过的模板 ID 和模板中实际使用的参数名。
  # - id: markdown-template-demo
  #   enabled: true
  #   priority: 6
  #   trigger:
  #     type: command
  #     values: ["模板演示"]
  #   reply:
  #     type: markdown
  #     custom_template_id: "替换为你的模板ID"
  #     params:
  #       title: ["协会小助手"]
  #       content: ["发送 /帮助 查看可用功能。"]

  - id: about-association
    enabled: true
    priority: 15
    trigger:
      type: command
      values: ["关于协会", "协会介绍"]
    reply:
      type: markdown
      text: |
        我们协会是**信息工程学院直属协会**，平时在群里可以解决会员们的各种电脑问题。
        授课内容主要围绕 **Web 前端开发设计类**。
        协会学长学姐大部分都是在信息学院比赛的，有想法参加比赛的会员可以来联系学长学姐👋🏻👋🏻👋🏻

  - id: minecraft-servers
    enabled: true
    priority: 16
    trigger:
      type: command
      values: ["我的世界", "minecraft", "mc"]
    reply:
      type: markdown
      text: |
        共有两个服：
        非常欢迎各位校友大佬进服来玩~
        ## 🌏 原版插件服
        - 版本：26.2（Java）
        - 服务器地址：`103.236.53.254:25565`
        ## 💀 整合包服《亡者世界》
        - 服务器地址：`103.236.53.254:25560`
        - 整合包文件在群文件里哦

  - id: help
    enabled: true
    priority: 10
    trigger:
      type: command
      values: ["帮助", "菜单"]
    reply:
      type: text
      text: |
        可用功能：
        /帮助 - 查看帮助
        /你好 - 向机器人打招呼
        /关于协会 - 协会介绍
        /我的世界 - MC 服务器信息
        /markdown - Markdown 效果演示

  - id: greeting
    enabled: true
    priority: 20
    trigger:
      type: command
      values: ["你好", "hi", "hello"]
    reply:
      type: text
      selection: random
      candidates:
        - "你好呀！"
        - "你好，有什么可以帮你？"
        - "我在的，请说。"

